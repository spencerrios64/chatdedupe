<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>chatdedupe</title><script>(()=>{const T=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
const crc=u=>{let c=~0;for(let i=0;i<u.length;i++)c=T[(c^u[i])&255]^(c>>>8);return ~c>>>0};
const enc=new TextEncoder();
class Z{constructor(){this.items=[];this.pre=''}
 folder(n){const f=new Z();f.items=this.items;f.pre=this.pre+n+'/';return f}
 file(n,c){this.items.push([this.pre+n,typeof c==='string'?enc.encode(c):c]);return this}
 async generateAsync(){const parts=[],cd=[];let off=0;const w=a=>{parts.push(a);off+=a.length};
  for(const [name,data] of this.items){const nb=enc.encode(name),cr=crc(data);
   const h=new DataView(new ArrayBuffer(30));h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint32(14,cr,true);h.setUint32(18,data.length,true);h.setUint32(22,data.length,true);h.setUint16(26,nb.length,true);
   const start=off;w(new Uint8Array(h.buffer));w(nb);w(data);
   const c=new DataView(new ArrayBuffer(46));c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint32(16,cr,true);c.setUint32(20,data.length,true);c.setUint32(24,data.length,true);c.setUint16(28,nb.length,true);c.setUint32(42,start,true);
   cd.push(new Uint8Array(c.buffer),nb)}
  const cds=off;cd.forEach(w);const e=new DataView(new ArrayBuffer(22));e.setUint32(0,0x06054b50,true);e.setUint16(8,this.items.length,true);e.setUint16(10,this.items.length,true);e.setUint32(12,off-cds,true);e.setUint32(16,cds,true);w(new Uint8Array(e.buffer));
  return new Blob(parts,{type:'application/zip'})}
 static async loadAsync(file){const buf=new Uint8Array(await file.arrayBuffer()),dv=new DataView(buf.buffer);let e=buf.length-22;while(e>=0&&dv.getUint32(e,true)!==0x06054b50)e--;
  if(e<0)throw new Error('not a zip');const n=dv.getUint16(e+10,true);let p=dv.getUint32(e+16,true);const files={};
  for(let i=0;i<n;i++){const method=dv.getUint16(p+10,true),csz=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),el=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),lo=dv.getUint32(p+42,true);
   const name=new TextDecoder().decode(buf.subarray(p+46,p+46+nl));p+=46+nl+el+cl;
   const ln=dv.getUint16(lo+26,true),le=dv.getUint16(lo+28,true),ds=lo+30+ln+le;
   files[name]={dir:name.endsWith('/'),async:async()=>{const raw=buf.subarray(ds,ds+csz);if(method===0)return new TextDecoder().decode(raw);
     const s=new Blob([raw]).stream().pipeThrough(new DecompressionStream('deflate-raw'));return new TextDecoder().decode(await new Response(s).arrayBuffer())}}}
  return {files}}}
window.JSZip=Z})();
</script><style>:root{--bg:#0f1117;--card:#181b24;--bd:#2a2f3d;--tx:#e6e8ee;--mut:#8b92a6;--ac:#7c9cff}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,Segoe UI,sans-serif;background:var(--bg);color:var(--tx)}
main{max-width:980px;margin:0 auto;padding:24px 16px 60px}h1{margin:.2em 0}p.sub{color:var(--mut);margin-top:0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin:14px 0}
.drop{border:2px dashed var(--bd);border-radius:12px;padding:28px;text-align:center;color:var(--mut);cursor:pointer}
.drop.over,.drop:hover{border-color:var(--ac);color:var(--tx)}
button,select,input,textarea{font:inherit;color:var(--tx);background:#10131b;border:1px solid var(--bd);border-radius:8px;padding:8px 12px}
button{cursor:pointer;background:var(--ac);color:#0b0e16;border:0;font-weight:600}button.sec{background:#222736;color:var(--tx)}
button:disabled{opacity:.4;cursor:default}input[type=text],input:not([type]),textarea{width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.mut{color:var(--mut)}.pill{background:#222736;border-radius:99px;padding:2px 10px;font-size:12px;color:var(--mut)}
.hit{border-top:1px solid var(--bd);padding:10px 0}.hit:first-child{border:0}mark{background:#5a4b00;color:#ffe98a;border-radius:3px}
table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid var(--bd);padding:6px 8px;text-align:left}

</style></head><body><main><h1>chatdedupe</h1><p class="sub">Find duplicate and near-duplicate AI chats (same question asked twice, or across several AIs) and export a clean set. Runs in your browser.</p>
<div class="card"><div class="drop" id="drop">Drop Claude / ChatGPT exports here</div><div id="status" class="note"></div></div>
<div class="card" id="ctl" hidden><div class="row"><label>Similarity threshold <b id="tv">0.6</b></label><input type="range" id="th" min="0.3" max="0.95" step="0.05" value="0.6"><button id="exp">Download cleaned JSON</button></div>
<p class="note">In each group, the longest chat is kept; the rest are dropped from the export. Untick a chat to keep it too.</p></div>
<div id="groups"></div>
<script>
/* shared core: parse AI chat exports in the browser (nothing is uploaded) */
const Chats = (() => {
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  function textOfClaude(m){
    if (m.text) return m.text;
    if (Array.isArray(m.content)) return m.content.map(c => c.text || '').join('\n');
    return '';
  }
  function parseData(data, name){
    const out = [];
    if (!Array.isArray(data)) data = data && data.conversations ? data.conversations : [data];
    for (const c of data){
      if (!c) continue;
      if (c.chat_messages){ // Claude
        out.push({id:c.uuid||c.id||name+out.length, title:c.name||'(untitled)', ai:'Claude',
          created:c.created_at||'', messages:c.chat_messages.map(m=>({role:m.sender==='human'?'user':'assistant', text:textOfClaude(m)})).filter(m=>m.text)});
      } else if (c.mapping){ // ChatGPT
        const msgs = Object.values(c.mapping).map(n=>n.message).filter(m=>m&&m.content&&m.author&&m.author.role!=='system'&&m.author.role!=='tool')
          .sort((a,b)=>(a.create_time||0)-(b.create_time||0))
          .map(m=>({role:m.author.role, text:(m.content.parts||[]).filter(p=>typeof p==='string').join('\n')})).filter(m=>m.text.trim());
        out.push({id:c.conversation_id||c.id||name+out.length, title:c.title||'(untitled)', ai:'ChatGPT',
          created:c.create_time?new Date(c.create_time*1000).toISOString():'', messages:msgs});
      } else if (Array.isArray(c.messages)){ // generic
        out.push({id:c.id||name+out.length, title:c.title||c.name||'(untitled)', ai:c.ai||c.source||'Other',
          created:c.created||c.created_at||'', messages:c.messages.map(m=>({role:m.role||(m.sender==='human'?'user':'assistant'), text:m.text||m.content||''})).filter(m=>m.text)});
      }
    }
    return out;
  }
  async function loadFiles(fileList){
    let all = [];
    for (const f of fileList){
      if (/\.zip$/i.test(f.name) && window.JSZip){
        const z = await JSZip.loadAsync(f);
        for (const [n, e] of Object.entries(z.files)){
          if (!e.dir && /\.json$/i.test(n) && /conversation|chat/i.test(n)){
            try { all = all.concat(parseData(JSON.parse(await e.async('string')), n)); } catch(_){}
          }
        }
      } else if (/\.jsonl$/i.test(f.name)){
        const lines = (await f.text()).split('\n').filter(Boolean);
        try { all = all.concat(parseData(lines.map(l=>JSON.parse(l)), f.name)); } catch(_){}
      } else {
        try { all = all.concat(parseData(JSON.parse(await f.text()), f.name)); } catch(_){}
      }
    }
    return all;
  }
  const fullText = c => c.messages.map(m=>m.text).join('\n');
  const STOP = new Set('the a an and or but if of to in on at for with from by is are was were be been it this that these those i you he she we they me my your our their as not no so do does did can could would should will just have has had about into than then there what which who how when why also more some any all one'.split(' '));
  const tokens = s => (s.toLowerCase().match(/[a-z0-9À-ɏͰ-Ͽ]{2,}/g)||[]).filter(w=>!STOP.has(w));
  function download(name, content, type){
    const b = content instanceof Blob ? content : new Blob([content], {type: type||'text/plain'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = name; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
  }
  const PATTERNS = [
    [/sk-[A-Za-z0-9_\-]{20,}/g,'[API_KEY]'],[/AIza[0-9A-Za-z_\-]{30,}/g,'[API_KEY]'],[/gh[pousr]_[A-Za-z0-9]{30,}/g,'[GITHUB_TOKEN]'],
    [/AKIA[0-9A-Z]{16}/g,'[AWS_KEY]'],[/[\w.+-]+@[\w-]+\.[\w.-]+/g,'[EMAIL]'],[/\bhttps?:\/\/[^\s)]+/g,m=>m],
    [/(?<!\d)\+?\d[\d\s().-]{8,}\d(?!\d)/g,'[PHONE]'],[/\b(?:\d[ -]*?){13,16}\b/g,'[CARD]']
  ];
  const scrub = s => PATTERNS.reduce((t,[re,r])=>t.replace(re,r), s);
  return {esc, parseData, loadFiles, fullText, tokens, download, scrub};
})();
const $ = s => document.querySelector(s);
function dropzone(el, cb){
  el.addEventListener('dragover', e=>{e.preventDefault(); el.classList.add('over');});
  el.addEventListener('dragleave', ()=>el.classList.remove('over'));
  el.addEventListener('drop', e=>{e.preventDefault(); el.classList.remove('over'); cb(e.dataTransfer.files);});
  const inp = document.createElement('input'); inp.type='file'; inp.multiple=true; inp.hidden=true; inp.accept='.json,.jsonl,.zip';
  el.after(inp); el.addEventListener('click', ()=>inp.click()); inp.addEventListener('change', ()=>cb(inp.files));
}


let docs=[],groups=[],keep=new Set();
const shingles=d=>{const t=Chats.tokens(Chats.fullText(d));const s=new Set();for(let i=0;i<t.length-2;i++)s.add(t[i]+' '+t[i+1]+' '+t[i+2]);if(!s.size)t.forEach(x=>s.add(x));return s};
const jac=(a,b)=>{if(!a.size||!b.size)return 0;let n=0;const[s,l]=a.size<b.size?[a,b]:[b,a];for(const x of s)if(l.has(x))n++;return n/(a.size+b.size-n)};
function run(){
  const th=+$('#th').value;$('#tv').textContent=th;const n=docs.length,par=[...Array(n).keys()];
  const find=x=>par[x]===x?x:(par[x]=find(par[x]));
  // containment-aware: also treat a short chat fully inside a longer one as duplicate
  for(let i=0;i<n;i++)for(let j=i+1;j<n;j++){const a=docs[i].sh,b=docs[j].sh;let sc=jac(a,b);
    const sm=Math.min(a.size,b.size);if(sm>0&&sm<Math.max(a.size,b.size)){let c=0;const[s,l]=a.size<b.size?[a,b]:[b,a];for(const x of s)if(l.has(x))c++;sc=Math.max(sc,c/sm*.9);}
    if(sc>=th)par[find(i)]=find(j);}
  const m={};for(let i=0;i<n;i++)(m[find(i)]=m[find(i)]||[]).push(i);
  groups=Object.values(m).filter(g=>g.length>1);keep=new Set(docs.map((_,i)=>i));
  groups.forEach(g=>{g.sort((a,b)=>docs[b].messages.length-docs[a].messages.length);g.slice(1).forEach(i=>keep.delete(i))});render();
}
function render(){
  $('#status').textContent=`${docs.length} chats · ${groups.length} duplicate groups · ${docs.length-keep.size} would be removed`;
  $('#groups').innerHTML=groups.map(g=>`<div class="card">`+g.map(i=>`<div class="row"><input type="checkbox" data-i="${i}" ${keep.has(i)?'checked':''} style="width:auto"><b>${Chats.esc(docs[i].title)}</b><span class="pill">${docs[i].ai}</span><span class="note">${docs[i].messages.length} msgs · ${docs[i].created.slice(0,10)}</span></div>`).join('')+`</div>`).join('')||'<p class="note">No duplicates at this threshold.</p>';
  document.querySelectorAll('#groups input').forEach(c=>c.onchange=()=>{c.checked?keep.add(+c.dataset.i):keep.delete(+c.dataset.i);$('#status').textContent=`${docs.length} chats · ${groups.length} duplicate groups · ${docs.length-keep.size} would be removed`});
}
dropzone($('#drop'),async fl=>{$('#status').textContent='Reading…';docs=await Chats.loadFiles(fl);docs.forEach(d=>d.sh=shingles(d));$('#ctl').hidden=false;run();});
$('#th').oninput=()=>docs.length&&run();
$('#exp').onclick=()=>Chats.download('chats-deduped.json',JSON.stringify(docs.filter((_,i)=>keep.has(i)).map(({sh,...d})=>d),null,1),'application/json');
</script>
</main></body></html>
